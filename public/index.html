<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Sender</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://i.ibb.co/kVD8k0PD/pexels-kovyrina-937980.jpg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.05); /* More transparent */
      backdrop-filter: blur(20px); /* Increased blur for glass effect */
      padding: 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      color: white;
      margin-bottom: 1.5rem;
      animation: slideDown 1s ease-in-out;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .input-group {
      position: relative;
      margin-bottom: 2rem;
      animation: slideUp 1s ease-in-out;
    }

    .input-group label {
      display: block;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 0.5rem;
      font-weight: 500;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .input-group input:focus {
      border-color: white;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .button {
      background: white;
      color: #128C7E;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .button:hover {
      background: #128C7E;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none;
    }

    #batchIdLink {
      color: #007bff;
      text-decoration: none;
    }

    #batchIdLink:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- WhatsApp Login Section -->
    <div id="loginSection">
      <h1>WhatsApp Login</h1>
      <div class="input-group">
        <input type="text" id="phoneNumber" placeholder="Enter your phone number" required>
      </div>
      <button class="button" onclick="requestPairingCode()">Get Pairing Code</button>
    </div>

    <!-- Message Sending Section (Hidden Initially) -->
    <div id="messageSection" class="hidden">
      <h1>Send Messages</h1>
      <div class="input-group">
        <select id="targetType">
          <option value="numbers">Target Numbers</option>
          <option value="groups">Groups</option>
        </select>
      </div>
      <div class="input-group">
        <input type="text" id="targets" placeholder="Enter targets (comma-separated)" required>
      </div>
      <div class="input-group">
        <input type="text" id="prefix" placeholder="Enter message prefix" required>
      </div>
      <div class="input-group">
        <input type="number" id="delay" placeholder="Enter delay (in seconds)" required>
      </div>
      <div class="input-group">
        <input type="file" id="messageFile" accept=".txt" required>
      </div>
      <button class="button" onclick="sendMessages()">Send Messages</button>
      <p id="result"></p>
      <p id="batchIdContainer" class="hidden">
        Your Batch ID: <a id="batchIdLink" href="#" target="_blank"></a>
      </p>
    </div>
  </div>

  <script>
    // Function to request pairing code
    async function requestPairingCode() {
      const phoneNumber = document.getElementById('phoneNumber').value;

      if (!phoneNumber) {
        alert("Please enter your phone number!");
        return;
      }

      const response = await fetch('/request-pairing-code', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ phoneNumber }),
      });

      const result = await response.json();

      if (result.success) {
        alert(`Your Pairing Code Is: ${result.pairingCode}`);
        // Show message sending section after successful login
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('messageSection').classList.remove('hidden');
      } else {
        alert(`Error: ${result.message}`);
      }
    }

    // Function to send messages
    async function sendMessages() {
      const targetType = document.getElementById('targetType').value;
      const targets = document.getElementById('targets').value;
      const prefix = document.getElementById('prefix').value;
      const delay = document.getElementById('delay').value;
      const fileInput = document.getElementById('messageFile');

      if (!targets || !prefix || !delay || !fileInput.files[0]) {
        alert("All fields are required!");
        return;
      }

      const formData = new FormData();
      formData.append('targetType', targetType);
      formData.append('targets', targets);
      formData.append('prefix', prefix);
      formData.append('delay', delay);
      formData.append('messageFile', fileInput.files[0]);

      const response = await fetch('/send-messages', {
        method: 'POST',
        body: formData,
      });

      const result = await response.json();
      if (result.success) {
        // Show Batch ID with hyperlink
        const batchIdLink = document.getElementById('batchIdLink');
        batchIdLink.textContent = result.batchId;
        batchIdLink.href = `/track-messages?batchId=${result.batchId}`;
        document.getElementById('batchIdContainer').classList.remove('hidden');
      } else {
        document.getElementById('result').textContent = result.message;
        document.getElementById('result').style.color = 'red';
      }
    }
  </script>
</body>
</html>
